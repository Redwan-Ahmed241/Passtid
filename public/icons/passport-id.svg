<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Swedish passport and national ID card"><title>Swedish passport and national ID card</title>
  <!-- Passport: burgundy cover, gold embossing -->
  <rect x="12" y="10" width="64" height="92" rx="7" fill="#7A1F34"/>
  <rect x="12" y="10" width="64" height="92" rx="7" fill="none" stroke="#5A1424" stroke-width="2"/>
  <!-- Top text (EUROPEISKA UNIONEN / SVERIGE / PASS) as gold bars -->
  <rect x="26" y="20" width="36" height="2.5" rx="1.2" fill="#D4AF37"/>
  <rect x="31" y="27" width="26" height="3" rx="1.5" fill="#D4AF37"/>
  <rect x="35" y="35" width="18" height="4" rx="2" fill="#D4AF37"/>
  <!-- Lesser coat of arms: shield with three crowns -->
  <path d="M33 52h22v14c0 8-5 13-11 16-6-3-11-8-11-16z" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#D4AF37">
    <path d="M35 64V59l2 2 2-3 2 3 2-2V64z"/>
    <path d="M45 64V59l2 2 2-3 2 3 2-2V64z"/>
    <path d="M40 75V70l2 2 2-3 2 3 2-2V75z"/>
  </g>
  <!-- Biometric symbol -->
  <rect x="35" y="87" width="18" height="9" rx="4.5" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="44" cy="91.5" r="2.2" fill="#D4AF37"/>
  <!-- National ID card -->
  <rect x="52" y="62" width="68" height="46" rx="7" fill="#F4F6F8" stroke="#7A1F34" stroke-width="3"/>
  <rect x="55" y="65" width="62" height="8" rx="4" fill="#7A1F34"/>
  <circle cx="68" cy="84" r="5.5" fill="#7A1F34"/>
  <path d="M58 101c0-6 4.5-10 10-10s10 4 10 10z" fill="#7A1F34"/>
  <rect x="84" y="80" width="28" height="4" rx="2" fill="#7A1F34"/>
  <rect x="84" y="88" width="22" height="4" rx="2" fill="#B9A3AA"/>
  <rect x="84" y="96" width="26" height="4" rx="2" fill="#B9A3AA"/>
</svg>
